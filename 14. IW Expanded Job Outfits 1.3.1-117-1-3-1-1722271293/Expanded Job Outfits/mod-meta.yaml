Name: Expanded Job Outfits (Infinite Ver.)
Author: DeathChaos
Version: 1.3.0
Description: "This is a mod for Yakuza 8 that adds a few more outfits for every character, usable in every job.\n\nThis mod adds at least 2 new outfits for every character (whether it be a unique outfit, or a shared outfit set such as the Bleach Japan outfit), some of these are returning outfits, while others are new outfits referencing other existing characters just as the existing DLC does, or even outfits that already exist within the game but are not normally usable in jobs (such as Ichiban's clothes when he goes on the date with Saeko at the beginning of the game).\n\nThis mod also has a neat feature for players who have not completed the game, by holding down a specific key or button on your controller, you can have the outfit apply in the overworld just as it would during premium adventure!.\n\nFor keyboard users, this key is SHIFT (left or right works) or the space bar.\nFor Controller users, hold down either L2/R2 or LT/RT (depending on controller type, its the shoulder triggers)."
